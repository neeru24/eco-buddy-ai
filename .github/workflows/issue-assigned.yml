name: Issue Assigned Notification

on:
  issues:
    types:
      - assigned

permissions:
  issues: write
  contents: read

jobs:
  notify-assignment:
    runs-on: ubuntu-latest

    steps:
      - name: Notify assignee
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const assignee = context.payload.issue.assignee.login;
            const issue_number = context.payload.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: `You've been assigned this issue, @${assignee}! 🎯 **Please submit a valid PR within 2 days (48 hours).** If no PR is submitted within the deadline, the issue may be unassigned and reopened for other contributors. 🚀`            });
